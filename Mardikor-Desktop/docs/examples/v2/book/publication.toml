default_preset = "pdf-a5"

[[presets]]
id = "pdf-a5"
name = "A5 阅读版"
format = "pdf"

[presets.body]
font_size = 15
line_height = 1.7

[presets.pdf]
layout = "flow"
page_width = 148
page_height = 210
margin_top = 15
margin_bottom = 15
margin_left = 16
margin_right = 16
include_cover = true
include_toc = true
chapter_break = "page"

[[presets]]
id = "epub-reflow"
name = "可重排电子书"
format = "epub"

[presets.epub]
layout = "reflowable"
direction = "ltr"
include_cover = true
toc_in_spine = false
embed_font = false
